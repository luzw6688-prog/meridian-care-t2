<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple acupressure massage stick for gentle everyday relaxation routines."
    />
    <meta name="theme-color" content="#f7f2e8" />
    <title>Acupressure Massage Stick | Meridian Care</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content" data-i18n="skip.content">Skip to content</a>
    <div id="app"></div>
    <div class="modal-layer" data-modal-layer hidden>
      <div class="modal-backdrop" data-modal-backdrop></div>
      <section
        class="interest-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="interest-modal-title"
        aria-describedby="interest-modal-copy interest-email-helper"
        tabindex="-1"
        data-interest-modal
      >
        <button
          class="modal-close"
          type="button"
          aria-label="Close dialog"
          data-modal-close
          data-i18n-aria-label="modal.close"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6 6 18"></path>
          </svg>
        </button>
        <div class="modal-symbol" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <path d="m8 16 5 5L24 10"></path>
          </svg>
        </div>
        <p class="eyebrow" data-i18n="modal.eyebrow">Interest recorded</p>
        <h2 id="interest-modal-title" data-i18n="modal.title">Thanks for your interest!</h2>
        <p id="interest-modal-copy" data-i18n="modal.copy">
          This product is currently in development. Your response helps us decide whether to
          launch it.
        </p>
        <form class="interest-form" data-interest-form>
          <div class="form-field">
            <label for="interest-email" data-i18n="modal.emailLabel">Email (optional)</label>
            <input
              id="interest-email"
              name="email"
              type="email"
              autocomplete="email"
              inputmode="email"
              placeholder="name@example.com"
              aria-describedby="interest-email-helper"
              data-interest-email
            />
            <p id="interest-email-helper" data-i18n="modal.emailHelper">
              We’ll notify you at this email address as soon as the product becomes available.
            </p>
          </div>
          <button
            class="button button-primary modal-confirm"
            type="submit"
            data-modal-confirm
            data-i18n="modal.confirm"
          >
            Got It
          </button>
        </form>
      </section>
    </div>
    <script defer src="./app.bundle.js"></script>
  </body>
</html>
